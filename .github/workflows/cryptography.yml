name: Milvasoft.Cryptography Nuget Publish

on:
  push:
    branches: [ master ]
    paths:
      - 'src/Cryptography/Milvasoft.Cryptography/**'
      - '**/Directory.Build.props'

permissions:
  contents: read
  id-token: write  # passed to nuget-publish.yml for NuGet trusted publishing

jobs:
  publish:
    uses: ./.github/workflows/nuget-publish.yml
    with:
      project: src/Cryptography/Milvasoft.Cryptography/Milvasoft.Cryptography.csproj
