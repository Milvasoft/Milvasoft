name: Milvasoft.MultiTenancy.EfCore Nuget Publish

on:
  push:
    branches: [ master ]
    paths:
      - 'src/MultiTenancy/Milvasoft.MultiTenancy.EfCore/**'
      - '**/Directory.Build.props'

permissions:
  contents: read
  id-token: write  # passed to nuget-publish.yml for NuGet trusted publishing

jobs:
  publish:
    uses: ./.github/workflows/nuget-publish.yml
    with:
      project: src/MultiTenancy/Milvasoft.MultiTenancy.EfCore/Milvasoft.MultiTenancy.EfCore.csproj
