name: Milvasoft.Notification.Mail.Smtp Nuget Publish

on:
  push:
    branches: [ master ]
    paths:
      - 'src/Notification/Milvasoft.Notification.Mail.Smtp/**'
      - '**/Directory.Build.props'

permissions:
  contents: read
  id-token: write  # passed to nuget-publish.yml for NuGet trusted publishing

jobs:
  publish:
    uses: ./.github/workflows/nuget-publish.yml
    with:
      project: src/Notification/Milvasoft.Notification.Mail.Smtp/Milvasoft.Notification.Mail.Smtp.csproj
