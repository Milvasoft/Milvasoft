name: Milvasoft.Localization.Redis Nuget Publish

on:
  push:
    branches: [ master ]
    paths:
      - 'src/Localization/Milvasoft.Localization.Redis/**'
      - '**/Directory.Build.props'

permissions:
  contents: read
  id-token: write  # passed to nuget-publish.yml for NuGet trusted publishing

jobs:
  publish:
    uses: ./.github/workflows/nuget-publish.yml
    with:
      project: src/Localization/Milvasoft.Localization.Redis/Milvasoft.Localization.Redis.csproj
