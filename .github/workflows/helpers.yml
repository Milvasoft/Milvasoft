name: Milvasoft.Helpers Nuget Publish

on:
  push:
    branches: [ master ]
    paths:
      - 'src/**'
      - '**/Directory.Build.props'

permissions:
  contents: read
  id-token: write  # passed to nuget-publish.yml for NuGet trusted publishing

jobs:
  publish:
    uses: ./.github/workflows/nuget-publish.yml
    with:
      project: src/Milvasoft.Helpers/Milvasoft.Helpers.csproj
