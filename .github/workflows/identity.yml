name: Milvasoft.Identity Nuget Publish

on:
  push:
    branches: [ master ]
    paths:
      - 'src/Identity/Milvasoft.Identity/**'
      - '**/Directory.Build.props'

permissions:
  contents: read
  id-token: write  # passed to nuget-publish.yml for NuGet trusted publishing

jobs:
  publish:
    uses: ./.github/workflows/nuget-publish.yml
    with:
      project: src/Identity/Milvasoft.Identity/Milvasoft.Identity.csproj
