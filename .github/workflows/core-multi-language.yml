name: Milvasoft.Core.MultiLanguage Nuget Publish

on:
  push:
    branches: [ master ]
    paths:
      - 'src/Core/Milvasoft.Core.MultiLanguage/**'
      - '**/Directory.Build.props'

permissions:
  contents: read
  id-token: write  # passed to nuget-publish.yml for NuGet trusted publishing

jobs:
  publish:
    uses: ./.github/workflows/nuget-publish.yml
    with:
      project: src/Core/Milvasoft.Core.MultiLanguage/Milvasoft.Core.MultiLanguage.csproj
