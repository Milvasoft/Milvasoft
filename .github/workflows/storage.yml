name: Milvasoft.Storage Nuget Publish

on:
  push:
    branches: [ master ]
    paths:
      - 'src/FileOperations/**'
      - '**/Directory.Build.props'

permissions:
  contents: read
  id-token: write  # passed to nuget-publish.yml for NuGet trusted publishing

jobs:
  publish:
    uses: ./.github/workflows/nuget-publish.yml
    with:
      project: src/FileOperations/Milvasoft.Storage/Milvasoft.Storage.csproj
