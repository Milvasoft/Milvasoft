name: Milvasoft.DataAccess.MongoDB Nuget Publish

on:
  push:
    branches: [ master ]
    paths:
      - 'src/DataAccess/Milvasoft.DataAccess.MongoDB/**'
      - '**/Directory.Build.props'

permissions:
  contents: read
  id-token: write  # passed to nuget-publish.yml for NuGet trusted publishing

jobs:
  publish:
    uses: ./.github/workflows/nuget-publish.yml
    with:
      project: src/DataAccess/Milvasoft.DataAccess.MongoDB/Milvasoft.DataAccess.MongoDB.csproj
