name: Milvasoft.Interception.Ef Nuget Publish

on:
  push:
    branches: [ master ]
    paths:
      - 'src/Interception/Milvasoft.Interception.Ef/**'
      - '**/Directory.Build.props'

permissions:
  contents: read
  id-token: write  # passed to nuget-publish.yml for NuGet trusted publishing

jobs:
  publish:
    uses: ./.github/workflows/nuget-publish.yml
    with:
      project: src/Interception/Milvasoft.Interception.Ef/Milvasoft.Interception.Ef.csproj
