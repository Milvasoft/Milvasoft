name: Milvasoft.ExpressionBuilder Nuget Publish

on:
  push:
    branches: [ master ]
    paths:
      - 'src/Components/Milvasoft.ExpressionBuilder/**'
      - '**/Directory.Build.props'

permissions:
  contents: read
  id-token: write  # passed to nuget-publish.yml for NuGet trusted publishing

jobs:
  publish:
    uses: ./.github/workflows/nuget-publish.yml
    with:
      project: src/Components/Milvasoft.ExpressionBuilder/Milvasoft.ExpressionBuilder.csproj
