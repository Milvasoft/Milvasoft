name: Milvasoft.JobScheduling Nuget Publish

on:
  push:
    branches: [ master ]
    paths:
      - 'src/Scheduling/Milvasoft.JobScheduling/**'
      - '**/Directory.Build.props'

permissions:
  contents: read
  id-token: write  # passed to nuget-publish.yml for NuGet trusted publishing

jobs:
  publish:
    uses: ./.github/workflows/nuget-publish.yml
    with:
      project: src/Scheduling/Milvasoft.JobScheduling/Milvasoft.JobScheduling.csproj
