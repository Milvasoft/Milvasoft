name: Milvasoft.Caching.Redis Nuget Publish

on:
  push:
    branches: [ master ]
    paths:
      - 'src/Caching/**'
      - '**/Directory.Build.props'

permissions:
  contents: read
  id-token: write  # passed to nuget-publish.yml for NuGet trusted publishing

jobs:
  publish:
    uses: ./.github/workflows/nuget-publish.yml
    with:
      project: src/Caching/Milvasoft.Caching.Redis/Milvasoft.Caching.Redis.csproj
