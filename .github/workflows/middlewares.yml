name: Milvasoft.Middlewares Nuget Publish

on:
  push:
    branches: [ master ]
    paths:
      - 'src/Middlewares/Milvasoft.Middlewares/**'
      - '**/Directory.Build.props'

permissions:
  contents: read
  id-token: write  # passed to nuget-publish.yml for NuGet trusted publishing

jobs:
  publish:
    uses: ./.github/workflows/nuget-publish.yml
    with:
      project: src/Middlewares/Milvasoft.Middlewares/Milvasoft.Middlewares.csproj
