name: Milvasoft.MultiTenancy.Stores.Redis Nuget Publish

on:
  push:
    branches: [ master ]
    paths:
      - 'src/MultiTenancy/**'
      - '**/Directory.Build.props'

permissions:
  contents: read
  id-token: write  # passed to nuget-publish.yml for NuGet trusted publishing

jobs:
  publish:
    uses: ./.github/workflows/nuget-publish.yml
    with:
      project: src/MultiTenancy/Milvasoft.MultiTenancy.Stores.Redis/Milvasoft.MultiTenancy.Stores.Redis.csproj
